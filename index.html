<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dates with Tayyibah</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&family=DM+Mono:wght@400;500&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3ECDD; --ink:#22302A; --pink:#E5226B; --green:#2F6B43; --deep:#1F3A2A; --blush:#FFC9DC; --sage:#8DAE82;
  --serif:"Playfair Display",Georgia,serif; --mono:"DM Mono",ui-monospace,monospace; --hand:"Caveat","Bradley Hand",cursive;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--mono)}
html{scroll-behavior:smooth}
body{-webkit-font-smoothing:antialiased;overflow-x:hidden}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- hero ---------- */
#hero{position:relative;height:100vh;height:100svh;min-height:520px;overflow:hidden}
#hero canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:pan-y;cursor:default}
#hint{position:absolute;left:0;right:0;bottom:calc(22px + env(safe-area-inset-bottom));text-align:center;font-size:12px;letter-spacing:.08em;color:var(--ink);opacity:.55;pointer-events:none;animation:bob 2.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}

/* ---------- gallery ---------- */
#dates{position:relative;padding:40px 0 190px}
.intro{text-align:center;margin:0 0 56px;padding:0 20px}
.intro .k{font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.6}
.intro .t{font-family:var(--serif);font-weight:700;font-size:clamp(26px,5vw,38px);margin:8px 0 0}
#count:empty{display:none}
#count{font-size:12px;letter-spacing:.06em;margin-top:10px;color:var(--green)}

.board{max-width:1440px;margin:0 auto;padding:0 28px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),520px));justify-content:center;gap:72px 28px;align-items:start}
@media (max-width:700px){.gcard{left:0}}
.gcard{justify-self:center;position:relative;top:var(--dy,0px);left:var(--dx,0px);opacity:0;transform:translateY(46px);transition:opacity .9s ease,transform .9s cubic-bezier(.2,.7,.2,1);padding:12px 0 8px}
.gcard.in{opacity:1;transform:none}
.board + .board,.board + .feature,.feature + .board{margin-top:0}
.board{margin-bottom:72px}

.stack{position:relative;width:var(--w);aspect-ratio:var(--ar)}
.polaroid{position:absolute;aspect-ratio:1 / 1.22;container-type:inline-size;transform:rotate(var(--rot,0deg));transition:transform .35s cubic-bezier(.2,.7,.2,1)}
.polaroid:hover{transform:rotate(0deg) scale(1.035);z-index:200!important}
.card{position:relative;height:100%;background:#FFFEFA;padding:4.4cqw 4.4cqw 0;display:flex;flex-direction:column;
  box-shadow:0 1px 2px rgba(0,0,0,.14),0 18px 38px -14px rgba(31,58,42,.45)}
.card::before{content:"";position:absolute;top:-3.6cqw;left:50%;width:27cqw;height:7.4cqw;margin-left:-13.5cqw;transform:rotate(-3deg);
  background:rgba(255,179,207,.78);box-shadow:0 1px 2px rgba(0,0,0,.08);z-index:2}
.ph{aspect-ratio:1;flex:none;background:#E6DECE;overflow:hidden;cursor:zoom-in}
.ph img{width:100%;height:100%;object-fit:cover;display:block;filter:grayscale(1) contrast(.75) brightness(1.25) sepia(.3);transition:filter 2.4s ease .35s}
.in .ph img{filter:none}
.cap{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 2cqw;overflow:hidden}
.cap .num{font-family:var(--serif);font-weight:700;font-size:max(15px,6.2cqw);line-height:1.1}
.cap .when{font-size:max(9.5px,3.2cqw);letter-spacing:.12em;text-transform:uppercase;opacity:.6;margin-top:.5em}
.cap .place{font-family:var(--hand);font-size:max(17px,7.2cqw);line-height:1.05;margin-top:.3em;color:var(--green);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card.empty{background:transparent;box-shadow:none;border:2px dashed #2F6B4366}
.card.empty::before{display:none}
.card.empty .ph{display:flex;align-items:center;justify-content:center;background:transparent;cursor:default;font-family:var(--hand);font-size:max(20px,8cqw);color:var(--green);text-align:center;padding:20px}

/* ---------- the big moment ---------- */
.feature{position:relative;background:var(--deep);color:#FFF8EE;padding:104px 24px 112px;margin:24px 0 96px;overflow:hidden}
.feature::before,.feature::after{content:"";position:absolute;left:0;right:0;height:24px;z-index:3;pointer-events:none}
.feature::before{top:0;background:radial-gradient(circle at 12px 0,var(--bg) 11px,transparent 12px) 0 0/24px 24px repeat-x}
.feature::after{bottom:0;background:radial-gradient(circle at 12px 24px,var(--bg) 11px,transparent 12px) 0 0/24px 24px repeat-x}
.fgrid{position:relative;z-index:2;max-width:1180px;margin:0 auto;display:grid;grid-template-columns:1fr 1.15fr;gap:56px;align-items:center}
.ftext,.fstack{opacity:0;transform:translateY(40px);transition:opacity 1s ease,transform 1s cubic-bezier(.2,.7,.2,1)}
.fstack{transition-delay:.2s;justify-self:center}
.feature.in .ftext,.feature.in .fstack{opacity:1;transform:none}
.feature .card{color:var(--ink)}
.feature .eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--blush);opacity:.9}
.feature h2{font-family:var(--serif);font-weight:700;font-size:clamp(34px,5.4vw,66px);line-height:1.02;margin:14px 0 0}
.feature .fplace{font-family:var(--hand);font-size:clamp(26px,3vw,38px);margin-top:16px;color:var(--blush)}
.feature .heart{display:inline-block;color:var(--pink);margin-right:.25em;font-size:.7em;vertical-align:.12em}
.petals{position:absolute;inset:0;z-index:1;pointer-events:none}
.petal{position:absolute;top:-6%;width:15px;height:11px;border-radius:100% 0 100% 0;opacity:.8;animation:fall var(--dur,10s) linear var(--delay,0s) infinite}
@keyframes fall{from{top:-6%;transform:translateX(0) rotate(0deg)}to{top:104%;transform:translateX(var(--sx,40px)) rotate(420deg)}}
@media (max-width:820px){
  .fgrid{grid-template-columns:1fr;gap:40px;text-align:center}
  .feature{padding:96px 16px 104px}
}
@media (prefers-reduced-motion:reduce){.petal{animation:none;top:50%}.gcard,.ftext,.fstack{transition:none}}

/* ---------- controls ---------- */
#bar{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:8px;z-index:20;padding:6px;border-radius:999px;background:var(--bg);border:1px solid #22302A33;box-shadow:0 10px 30px -10px rgba(0,0,0,.25)}
.btn{font:inherit;font-size:13px;letter-spacing:.04em;padding:11px 18px;border-radius:999px;border:1px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer;white-space:nowrap;transition:background .15s,color .15s}
.btn:hover{background:#22302A12}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.primary:hover{background:var(--pink);border-color:var(--pink);color:#fff}
.btn.sm{padding:8px 13px;font-size:12px}
#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translate(-50%,12px);max-width:min(92vw,420px);padding:10px 16px;border-radius:12px;background:var(--ink);color:var(--bg);font-size:12px;letter-spacing:.03em;text-align:center;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:60}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- dialog ---------- */
dialog{border:1px solid var(--ink);border-radius:18px;padding:0;background:var(--bg);color:var(--ink);font-family:var(--mono);width:min(92vw,440px);max-height:92vh;max-height:92dvh;overflow:auto}
dialog::backdrop{background:rgba(17,24,20,.55)}
form{padding:22px;display:flex;flex-direction:column;gap:14px}
form h2{margin:0;font-family:var(--serif);font-size:26px}
label,.lab{display:flex;flex-direction:column;gap:6px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;opacity:.9}
input[type=text],input[type=number],input[type=date]{font:inherit;font-size:15px;letter-spacing:0;text-transform:none;padding:10px 12px;border:1px solid #22302A44;border-radius:10px;background:#FFFEFA;color:var(--ink);width:100%}
input:focus-visible,button:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.two{display:grid;grid-template-columns:90px 1fr;gap:12px}
.hintline{font-size:11px;opacity:.65;letter-spacing:.02em;text-transform:none;line-height:1.4;margin-top:-6px}
#drop{display:flex;align-items:center;justify-content:center;aspect-ratio:16/10;border:2px dashed #2F6B4388;border-radius:12px;background:#FFFEFA;cursor:pointer;color:var(--green);font-family:var(--hand);font-size:24px;text-transform:none;letter-spacing:0}
#file{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px}
#editor{display:flex;flex-direction:column;gap:10px}
.vp{position:relative;width:100%;border-radius:10px;overflow:hidden;border:1px solid #22302A44;background:#fff}
#ed{display:block;width:100%;touch-action:none;cursor:grab}
#ed:active{cursor:grabbing}
.vp .grid{position:absolute;inset:0;pointer-events:none;background:
  linear-gradient(to right,transparent calc(33.3% - .5px),rgba(255,255,255,.65) calc(33.3% - .5px),rgba(255,255,255,.65) calc(33.3% + .5px),transparent calc(33.3% + .5px),transparent calc(66.6% - .5px),rgba(255,255,255,.65) calc(66.6% - .5px),rgba(255,255,255,.65) calc(66.6% + .5px),transparent calc(66.6% + .5px)),
  linear-gradient(to bottom,transparent calc(33.3% - .5px),rgba(255,255,255,.65) calc(33.3% - .5px),rgba(255,255,255,.65) calc(33.3% + .5px),transparent calc(33.3% + .5px),transparent calc(66.6% - .5px),rgba(255,255,255,.65) calc(66.6% - .5px),rgba(255,255,255,.65) calc(66.6% + .5px),transparent calc(66.6% + .5px));
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.edc{display:flex;align-items:center;gap:10px}
.edc input[type=range]{flex:1;accent-color:var(--pink)}
.chk{flex-direction:row;align-items:center;gap:10px;text-transform:none;letter-spacing:.02em;font-size:13px;cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--pink);flex:none}
.acts{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}

/* ---------- lightbox ---------- */
#lb{position:fixed;inset:0;z-index:50;background:rgba(17,24,20,.9);display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:4vmin;cursor:zoom-out}
#lb.on{display:flex}
#lb figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:12px;max-width:100%;min-height:0;flex:1 1 auto;justify-content:center;cursor:default}
#lb img{max-width:100%;max-height:calc(100vh - 170px);max-height:calc(100dvh - 170px);border:10px solid #FFFEFA;box-shadow:0 20px 60px rgba(0,0,0,.5);min-height:0}
#lbc{color:#FFF8EE;font-size:13px;letter-spacing:.06em;text-align:center}
#lb .row2{display:flex;gap:10px;align-items:center}
#lb .btn{border-color:#FFF8EE88;color:#FFF8EE;background:transparent}
#lb .btn:hover{background:#ffffff1f}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:1px solid #FFF8EE88;background:#00000040;color:#FFF8EE;font-size:24px;line-height:1;cursor:pointer}
#lbp{left:max(10px,2vw)}#lbn{right:max(10px,2vw)}
#lbx{position:absolute;top:14px;right:14px;width:40px;height:40px;border-radius:50%;border:1px solid #FFF8EE88;background:#00000040;color:#FFF8EE;font-size:22px;cursor:pointer}
</style>
</head>
<body>

<section id="hero">
  <h1 class="sr">Dates with Tayyibah</h1>
  <canvas id="cv" aria-hidden="true"></canvas>
  <div id="hint">scroll ↓</div>
</section>

<main id="dates">
  <div class="intro">
    <div class="k">the story so far</div>
    <div class="t">every date, in order</div>
    <div id="count"></div>
  </div>
  <div id="gallery"></div>
</main>

<div id="bar">
  <button class="btn primary" id="add" type="button">+ Add a date</button>
  <button class="btn" id="save" type="button" title="Download this page with every photo baked in">Save page</button>
</div>
<div id="toast" role="status"></div>

<dialog id="dlg">
  <form id="form" method="dialog">
    <h2>A new date</h2>
    <div class="lab">Photo
      <div id="drop" role="button" tabindex="0">tap to choose a photo</div>
      <div id="editor" hidden>
        <div class="vp"><canvas id="ed"></canvas><div class="grid"></div></div>
        <div class="edc">
          <button class="btn sm" type="button" id="rot">⟳ Rotate</button>
          <input id="zoom" type="range" min="1" max="4" step="0.01" value="1" aria-label="Zoom">
          <button class="btn sm" type="button" id="swap">Change</button>
        </div>
        <div class="hintline">Drag to move, pinch or use the slider to zoom.</div>
      </div>
      <input id="file" type="file" accept="image/*">
    </div>
    <div class="two">
      <label>Date #<input id="fnum" type="number" min="1" step="1" required></label>
      <label>When<input id="fdate" type="date" required></label>
    </div>
    <div class="hintline" id="join">Use the same number to add another photo to a date you already made.</div>
    <label>Where / what we did<input id="fplace" type="text" maxlength="60" placeholder="e.g. sunset coffee"></label>
    <label class="chk"><input type="checkbox" id="fimp"><span>This was a big moment ♥</span></label>
    <label id="lblwrap" hidden>Title for the big moment<input id="flabel" type="text" maxlength="40" placeholder="e.g. the day I asked"></label>
    <div class="acts">
      <button class="btn" type="button" id="cancel">Cancel</button>
      <button class="btn primary" type="submit" id="ok">Add to the page</button>
    </div>
  </form>
</dialog>

<div id="lb">
  <button id="lbx" type="button" aria-label="Close">×</button>
  <button id="lbp" class="nav" type="button" aria-label="Previous">‹</button>
  <figure><img alt=""><div id="lbc"></div></figure>
  <button id="lbn" class="nav" type="button" aria-label="Next">›</button>
  <div class="row2"><button class="btn sm" id="lbdel" type="button">Remove this photo</button></div>
</div>

<!-- Photos baked into this page live here. "Save page" rewrites this block. -->
<script id="dates-data" type="application/json">[]</script>

<script>
(function () {
'use strict';

/* =====================================================================
   Type Garden heading  (canvas port of Akshat Agarwal's Type Garden)
   ===================================================================== */
var F = '"Playfair Display",Georgia,serif';
var TITLE = 'Dates with Tayyibah';
var BG = '#F3ECDD';
var PALC = { red: '#E5226B', blue: '#2F6B43', line: '#FFB8D2', text: '#22302A', vein: BG, white: '#FFFEFA', wline: '#A8C29B', wedge: '#7FA173' };

class Garden {
  constructor(cv) {
    this.cv = cv; this.g = cv.getContext('2d');
    this.letters = []; this.uid = 1; this.cache = {}; this.Sd = 0; this.St = 0; this.wrapped = false;
    this.lastKey = 0; this.caretUntil = 0; this.t0 = performance.now(); this.rand = Math.random;
    this.fa = {}; this.mx = null; this.my = 0; this.flies = []; this.perch = []; this.visible = true;
    this.cx = 0; this.cy = 0; this.ctx_ = 0; this.cty = 0;
  }

  // ---------- math ----------
  h(n) { const x = Math.sin(n) * 43758.5453; return x - Math.floor(x); }
  spr(t, k = 7, w = 16) { if (t <= 0) return 0; return 1 - Math.exp(-t * k) * Math.cos(t * w); }
  eo(t) { if (t <= 0) return 0; if (t >= 1) return 1; return 1 - Math.pow(1 - t, 3); }
  rng(seed) {
    let s = seed | 0;
    return () => { s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  }
  bez(a, b, c, d, n) {
    const P = [];
    for (let i = 0; i <= n; i++) { const t = i / n, u = 1 - t;
      P.push([u*u*u*a[0] + 3*u*u*t*b[0] + 3*u*t*t*c[0] + t*t*t*d[0], u*u*u*a[1] + 3*u*u*t*b[1] + 3*u*t*t*c[1] + t*t*t*d[1]]); }
    return P;
  }
  at(P, u) {
    const n = P.length; const i = Math.min(n - 2, Math.max(1, Math.round(u * (n - 1))));
    return [P[i], Math.atan2(P[i+1][1] - P[i-1][1], P[i+1][0] - P[i-1][0])];
  }
  jit(id, f, amp) {
    if (!amp) return [0, 0, 0];
    return [(this.h(id*1.37 + f*7.13)*2 - 1)*amp, (this.h(id*2.71 + f*3.11)*2 - 1)*amp, (this.h(id*5.3 + f*1.7)*2 - 1)*0.035];
  }
  path(c, p, closed) {
    const n = p.length; if (n < 2) return;
    const m = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2];
    if (closed) {
      const s = m(p[n-1], p[0]); c.moveTo(s[0], s[1]);
      for (let i = 0; i < n; i++) { const q = m(p[i], p[(i+1) % n]); c.quadraticCurveTo(p[i][0], p[i][1], q[0], q[1]); }
      c.closePath();
    } else {
      c.moveTo(p[0][0], p[0][1]);
      for (let i = 1; i < n - 1; i++) { const q = m(p[i], p[i+1]); c.quadraticCurveTo(p[i][0], p[i][1], q[0], q[1]); }
      c.lineTo(p[n-1][0], p[n-1][1]);
    }
  }
  backend(g) {
    return {
      fill: (p, col, edge, ew) => { g.beginPath(); this.path(g, p, true); g.fillStyle = col; g.fill(); if (edge) { g.strokeStyle = edge; g.lineWidth = ew || 1; g.lineJoin = 'round'; g.stroke(); } },
      stroke: (p, col, w) => { g.beginPath(); this.path(g, p, false); g.strokeStyle = col; g.lineWidth = w; g.lineCap = 'round'; g.lineJoin = 'round'; g.stroke(); },
      rect: (x, y, w, h, col) => { g.fillStyle = col; g.fillRect(x, y, w, h); },
      text: (ch, x, y, S, col) => { g.font = '700 ' + S + 'px ' + F; g.textAlign = 'center'; g.textBaseline = 'alphabetic'; g.fillStyle = col; g.fillText(ch, x, y); }
    };
  }
  vine(base, dir, len, amp, waves, ph, bend, n) {
    n = n || 40; const P = [[base[0], base[1]]], step = len / n; let x = base[0], y = base[1];
    for (let i = 1; i <= n; i++) {
      const u = i / n, a = dir + bend * u + amp * Math.sin(u * Math.PI * waves + ph) * Math.min(1, u * 3);
      x += Math.cos(a) * step; y += Math.sin(a) * step; P.push([x, y]);
    }
    return P;
  }
  curl(P, sign, rad) {
    const n = P.length, e = P[n - 1], a = Math.atan2(e[1] - P[n - 2][1], e[0] - P[n - 2][0]);
    const c = [e[0] - Math.sin(a) * sign * rad, e[1] + Math.cos(a) * sign * rad];
    const a0 = Math.atan2(e[1] - c[1], e[0] - c[0]);
    for (let i = 1; i <= 14; i++) { const u = i / 14, t = a0 + sign * u * Math.PI * 1.6, rr = rad * (1 - 0.5 * u); P.push([c[0] + Math.cos(t) * rr, c[1] + Math.sin(t) * rr]); }
    return P;
  }
  weave(r, startLayer) {
    const cuts = []; const nc = 1 + Math.floor(r() * 3);
    for (let i = 0; i < nc; i++) cuts.push(0.15 + r() * 0.7);
    cuts.sort((a, b) => a - b);
    const segs = []; let u0 = 0, layer = startLayer;
    for (const c of cuts) {
      if (c <= u0) continue;
      segs.push({ u0, u1: c, layer });
      if (r() < 0.3) { const g = 0.02 + r() * 0.03; u0 = Math.min(0.98, c + g); } else u0 = c;
      layer = 1 - layer;
    }
    segs.push({ u0, u1: 1, layer });
    return segs;
  }
  layerAt(segs, u) { for (const s of segs) if (u >= s.u0 && u <= s.u1) return s.layer; return segs[segs.length - 1].layer; }

  // ---------- layout ----------
  resize() {
    const c = this.cv, r = c.getBoundingClientRect(), d = Math.min(2, window.devicePixelRatio || 1);
    if (!r.width || !r.height) return;
    this.W = r.width; this.H = r.height; this.dpr = d;
    c.width = Math.round(r.width * d); c.height = Math.round(r.height * d);
    this.layout(true);
  }
  mw(ch) {
    if (this.cache[ch] != null) return this.cache[ch];
    this.g.font = '700 100px ' + F;
    let w = this.g.measureText(ch).width / 100;
    if (ch === ' ') w *= 1.4;
    return (this.cache[ch] = w);
  }
  layoutCore(A, W, H, prevWrapped) {
    const maxW = W * 0.8, S0 = H * 0.28, LH = 2.1;
    const ws = A.map(l => this.mw(l.ch));
    const words = []; let cur = null;
    A.forEach((l, i) => {
      if (l.ch === ' ') { if (cur) { words.push(cur); cur = null; } words.push({ sp: true, idx: [i] }); }

  lb.addEventListener('touchend', function (e) {
    if (x0 == null) return; var dx = e.changedTouches[0].clientX - x0; x0 = null;
    if (Math.abs(dx) > 50) stepLB(dx < 0 ? 1 : -1);
  });
})();

// ---------- photo editor: crop, zoom, rotate ----------
var ed = { src: null, z: 1, ox: 0, oy: 0, V: 300, pd: 0 };
var edc = $('#ed'), edg = edc.getContext('2d'), zoomIn = $('#zoom');
function loadImage(file) {
  return new Promise(function (res, rej) {
    var u = URL.createObjectURL(file), im = new Image();
    im.onload = function () { URL.revokeObjectURL(u); res(im); };
    im.onerror = function () { URL.revokeObjectURL(u); rej(new Error('unreadable')); };
    im.src = u;
  });
}
function toSource(file) {
  return loadImage(file).then(function (im) {
    var s = Math.min(1, 2000 / Math.max(im.naturalWidth, im.naturalHeight));
    var c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(im.naturalWidth * s)); c.height = Math.max(1, Math.round(im.naturalHeight * s));
    c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
    return c;
  });
}
function edSize() {
  var w = edc.parentNode.clientWidth || 300, d = Math.min(2, window.devicePixelRatio || 1);
  ed.V = w; edc.width = Math.round(w * d); edc.height = Math.round(w * d); edc.style.height = w + 'px';
}
function edBase() { return Math.max(ed.V / ed.src.width, ed.V / ed.src.height); }
function edClamp() {
  var sc = edBase() * ed.z, mx = Math.max(0, (ed.src.width * sc - ed.V) / 2), my = Math.max(0, (ed.src.height * sc - ed.V) / 2);
  ed.ox = Math.max(-mx, Math.min(mx, ed.ox)); ed.oy = Math.max(-my, Math.min(my, ed.oy));
}
function edDraw() {
  if (!ed.src) return;
  var d = edc.width / ed.V, sc = edBase() * ed.z, w = ed.src.width * sc, h = ed.src.height * sc;
  edg.setTransform(d, 0, 0, d, 0, 0); edg.fillStyle = '#fff'; edg.fillRect(0, 0, ed.V, ed.V);
  edg.drawImage(ed.src, ed.V / 2 + ed.ox - w / 2, ed.V / 2 + ed.oy - h / 2, w, h);
}
function edExport() {
  var o = document.createElement('canvas'); o.width = o.height = 1200;
  var g = o.getContext('2d'), f = 1200 / ed.V, sc = edBase() * ed.z * f, w = ed.src.width * sc, h = ed.src.height * sc;
  g.fillStyle = '#fff'; g.fillRect(0, 0, 1200, 1200);
  g.drawImage(ed.src, 600 + ed.ox * f - w / 2, 600 + ed.oy * f - h / 2, w, h);
  return o.toDataURL('image/jpeg', 0.82);
}
function setZoom(z) {
  ed.z = Math.max(1, Math.min(4, z)); zoomIn.value = ed.z; edClamp(); edDraw();
}
zoomIn.addEventListener('input', function () { setZoom(+zoomIn.value); });
$('#rot').addEventListener('click', function () {
  if (!ed.src) return;
  var s = ed.src, c = document.createElement('canvas'); c.width = s.height; c.height = s.width;
  var g = c.getContext('2d'); g.translate(c.width / 2, c.height / 2); g.rotate(Math.PI / 2); g.drawImage(s, -s.width / 2, -s.height / 2);
  ed.src = c; ed.ox = ed.oy = 0; setZoom(1);
});
$('#swap').addEventListener('click', function () { fileIn.click(); });
(function () {
  var ptrs = new Map();
  edc.addEventListener('pointerdown', function (e) {
    try { edc.setPointerCapture(e.pointerId); } catch (x) {}
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY }); ed.pd = 0;
  });
  edc.addEventListener('pointermove', function (e) {
    if (!ed.src || !ptrs.has(e.pointerId)) return;
    var prev = ptrs.get(e.pointerId); ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (ptrs.size === 1) { ed.ox += e.clientX - prev.x; ed.oy += e.clientY - prev.y; edClamp(); edDraw(); }
    else if (ptrs.size === 2) {
      var a = Array.from(ptrs.values()), d = Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y);
      if (ed.pd) setZoom(ed.z * d / ed.pd); ed.pd = d;
    }
  });
  function up(e) { ptrs.delete(e.pointerId); ed.pd = 0; }
  edc.addEventListener('pointerup', up); edc.addEventListener('pointercancel', up);
  edc.addEventListener('wheel', function (e) { if (!ed.src) return; e.preventDefault(); setZoom(ed.z * (e.deltaY < 0 ? 1.06 : 0.94)); }, { passive: false });
})();

// ---------- add a date ----------
function todayISO() { var d = new Date(), p = function (n) { return String(n).padStart(2, '0'); }; return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()); }
function syncImp() { $('#lblwrap').hidden = !$('#fimp').checked; }
$('#fimp').addEventListener('change', syncImp);

function openAdd() {
  ed.src = null; fileIn.value = ''; $('#editor').hidden = true; drop.hidden = false;
  $('#fnum').value = photos.reduce(function (m, p) { return Math.max(m, p.n || 0); }, 0) + 1;
  $('#fdate').value = todayISO(); $('#fplace').value = ''; $('#fimp').checked = false; $('#flabel').value = '';
  $('#join').textContent = 'Use the same number to add another photo to a date you already made.';
  syncImp();
  if (dlg.showModal) dlg.showModal(); else dlg.setAttribute('open', '');
}
$('#add').addEventListener('click', openAdd);
$('#cancel').addEventListener('click', function () { dlg.close ? dlg.close() : dlg.removeAttribute('open'); });
drop.addEventListener('click', function () { fileIn.click(); });
drop.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileIn.click(); } });
fileIn.addEventListener('change', function () {
  var f = fileIn.files && fileIn.files[0]; if (!f) return;
  toSource(f).then(function (c) {
    ed.src = c; ed.ox = ed.oy = 0; ed.z = 1; zoomIn.value = 1;
    drop.hidden = true; $('#editor').hidden = false; edSize(); edDraw();
  }).catch(function () { toast('Couldn’t read that photo. Try a JPG or PNG.'); });
});
// typing an existing date number joins that date and borrows its details
$('#fnum').addEventListener('input', function () {
  var n = parseInt(this.value, 10), g = n ? groupByN(n) : null;
  if (g) {
    $('#fdate').value = g.date || $('#fdate').value; $('#fplace').value = g.place || '';
    $('#fimp').checked = g.imp; $('#flabel').value = g.label || ''; syncImp();
    $('#join').textContent = 'This joins the stack for Date ' + n + ' (' + g.photos.length + (g.photos.length === 1 ? ' photo' : ' photos') + ' so far).';
  } else $('#join').textContent = 'Use the same number to add another photo to a date you already made.';
});
$('#form').addEventListener('submit', function (e) {
  e.preventDefault();
  if (!ed.src) { toast('Choose a photo first.'); return; }
  var imp = $('#fimp').checked;
  var p = {
    id: 'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
    t: Date.now(),
    n: Math.max(1, parseInt($('#fnum').value, 10) || 1),
    date: $('#fdate').value || todayISO(),
    place: $('#fplace').value.trim(),
    imp: imp,
    label: imp ? $('#flabel').value.trim() : '',
    img: edExport()
  };
  photos.push(p); DB.put(p);
  dlg.close ? dlg.close() : dlg.removeAttribute('open');
  render();
  var target = gallery.querySelector('.polaroid');
  var gs = groups(), idx = -1; gs.forEach(function (g, i) { if (g.n === p.n) idx = i; });
  var nodes = gallery.querySelectorAll('.gcard, .feature'), node = null;
  // find the rendered node for this date: count in the same order they were appended
  var order = []; gs.forEach(function (g) { order.push(g.n); });
  var flat = gallery.querySelectorAll('.board > .gcard, .feature');
  if (flat.length === order.length) node = flat[order.indexOf(p.n)];
  if (node) setTimeout(function () { node.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 120);
  toast('Added. Tap “Save page” to bake it into the file you share.', 4200);
});

// ---------- save the page with every photo baked in ----------
function bakedHTML() {
  var list = photos.slice().sort(function (a, b) { return (a.n - b.n) || ((a.t || 0) - (b.t || 0)); }).map(function (p) {
    return { id: p.id, t: p.t || 0, n: p.n, date: p.date, place: p.place, imp: !!p.imp, label: p.label || '', img: p.img };
  });
  var json = JSON.stringify(list).replace(/</g, '\\u003c');
  var clone = document.documentElement.cloneNode(true);
  clone.querySelector('#gallery').innerHTML = '';
  clone.querySelector('#count').textContent = '';
  clone.querySelector('#toast').textContent = '';
  clone.querySelector('#toast').className = '';
  clone.querySelector('#lb').className = '';
  clone.querySelector('#lb img').removeAttribute('src');
  clone.querySelector('#lbc').textContent = '';
  clone.querySelector('#dlg').removeAttribute('open');
  clone.querySelector('#dates-data').textContent = json;
  return '<!DOCTYPE html>\n' + clone.outerHTML;
}
$('#save').addEventListener('click', function () {
  if (dlg.open) return;
  var html = bakedHTML();
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
  a.download = 'dates-with-tayyibah.html';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
  toast('Saved. Send her that file: all ' + photos.length + ' photo' + (photos.length === 1 ? ' is' : 's are') + ' inside it.', 4600);
});

// ---------- start ----------
var baked = [];
try { baked = JSON.parse($('#dates-data').textContent || '[]'); } catch (e) { baked = []; }
DB.open().then(function () { return DB.all(); }).then(function (local) {
  var gone = new Set(getDeleted()), map = new Map();
  baked.concat(local).forEach(function (p) { if (p && p.id && p.img && !gone.has(p.id)) map.set(p.id, p); });
  photos = Array.from(map.values());
  render();
});

})();
</script>
</body>
